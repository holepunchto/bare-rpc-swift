name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: macos-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - uses: holepunchto/actions/setup-swift@v1
      - run: npm run lint
      - run: swift format lint --recursive --strict .
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}
    steps:
      - uses: holepunchto/actions/node-base@v1
      - uses: holepunchto/actions/setup-swift@v1
      - uses: holepunchto/actions/setup-bare@v1
      - run: swift test
